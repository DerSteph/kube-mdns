{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-mdns.clusterRoleName" . }}
  labels:
    {{- include "kube-mdns.labels" . | nindent 4 }}
  {{- with .Values.rbac.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
  {{- if .Values.kubeMdns.enableCrd }}
  - apiGroups:
      - mdns.k8s.io
    resources:
      - mdnsrecords
      - mdnsrecords/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  {{- end }}
{{- with .Values.rbac.extraRules }}
{{ toYaml . | indent 2 }}
{{- end }}
{{- end }}
