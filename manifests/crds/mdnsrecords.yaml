apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mdnsrecords.mdns.net-pilgrim.dev
spec:
  group: mdns.net-pilgrim.dev
  names:
    kind: MdnsRecord
    listKind: MdnsRecordList
    plural: mdnsrecords
    singular: mdnsrecord
    shortNames:
      - mdns
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - host
                - ip
              properties:
                host:
                  type: string
                  description: "The .local hostname to announce via mDNS"
                ip:
                  type: string
                  description: "IPv4 address to advertise"
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 443
                  description: "Service port"
                serviceType:
                  type: string
                  default: "_http._tcp.local."
                  description: "mDNS / Bonjour service type"
                ttl:
                  type: integer
                  default: 120
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                      message:
                        type: string
                publishedHost:
                  type: string
                publishedIp:
                  type: string
                publishedPort:
                  type: integer
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Host
          type: string
          jsonPath: .spec.host
        - name: IP
          type: string
          jsonPath: .spec.ip
        - name: Port
          type: integer
          jsonPath: .spec.port
        - name: ServiceType
          type: string
          jsonPath: .spec.serviceType
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
